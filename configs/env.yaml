# FROZEN AT D0 — changed only by team vote, logged in docs/design_decisions.md
geometry:
  bs_pos:  [0.0, 0.0, 0.0]
  ris_pos: [30.0, 10.0, 10.0]
  user_zone:    {x1: 45.0, x2: 60.0, y1: -10.0, y2: 10.0, z: 0.0}   # RIS-aided zone
  gen_user_zone:{x1: 65.0, x2: 80.0, y1: -15.0, y2: 15.0, z: 0.0}   # unseen positions
dims:
  M: 8      # BS antennas (report M=4 ablation once)
  N: 64     # RIS elements (N=36 for fast debug: override on CLI of scripts, never here)
  K: 4      # users
power:
  p_tx_dbm: 30.0
  bandwidth_mhz: 1.0
  noise_figure_db: 7.0
  carrier_ghz: 3.5
channel:
  pathloss:
    direct_nlos_db:  {a: 128.1, b: 37.6, unit: km}   # BS->user (ITU UMi NLoS)
    ris_cascade_db:  {a: 61.4,  b: 35.8, unit: m}    # cascade two-hop (Wu-Zhang form)
data:
  train_n: 1500
  train_seed: 1000
  test_n: 500
  test_seed: 2000     # data/test_channels.npz — generated ONCE, never regenerated
  gen_n: 200
  gen_seed: 3000      # unseen user positions (generalization study)
episode:
  T: 1                # one phase vector per channel = CONTEXTUAL BANDIT (no gamma, ever)
seeds:
  training: [0, 1, 2, 3, 4]
  baseline_draws: 123   # seed of the random-phase draws & best-of-200 search
budget:
  env_steps: 200000   # IDENTICAL for every agent
  eval_every: 2000