name: CI
on: [pull_request, push]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pandas pyyaml pytest gymnasium matplotlib
      - run: python -m pytest tests/ -q